[project]
name = "coastline-engine"
version = "0.1.0"
description = "Geometry and CAM engine for Coastline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cadquery-ocp>=7.7",
  "rhino3dm>=8.0",
  "opencamlib>=2023.1",
  "pyclipper>=1.3",
  "numpy>=1.26",
  "trimesh>=4.0",
  "quiddity==0.4.9",
]

[dependency-groups]
dev = ["pytest>=8", "pybind11>=2.12"]

[tool.uv]
# cadquery-ocp needs VTK's libraries, and the vtk wheel declares matplotlib (and with it Pillow)
# for its Python text rendering. The engine never imports vtkmodules or matplotlib; the
# impossible marker drops them from the lock so they are neither installed nor shipped.
override-dependencies = ["matplotlib; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coastline_engine"]
